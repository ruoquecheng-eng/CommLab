name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install desktop build dependencies
        run: python -m pip install -e ".[desktop-build]" pytest
      - name: Desktop launcher tests
        run: python -m pytest -q tests/test_desktop_launcher.py
      - name: Build portable application
        run: python -m PyInstaller --noconfirm --clean desktop/CommLabDesktop.spec
      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop-artifacts | Out-Null
          Compress-Archive -Path dist/CommLab/* -DestinationPath desktop-artifacts/CommLab-Windows-x64.zip
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: ISCC.exe desktop/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: CommLab-v3.8.0-Windows-x64
          path: desktop-artifacts/*
          if-no-files-found: error
      - name: Publish public release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME desktop-artifacts/CommLab-Windows-x64.zip desktop-artifacts/CommLab-Setup-v3.8.0-Windows-x64.exe --title "CommLab v3.8.0" --notes-file docs/release_notes_v3.8.0.md
