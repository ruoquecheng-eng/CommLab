name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "desktop-v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install desktop build dependencies
        run: python -m pip install -e ".[desktop-build]"
      - name: Desktop launcher tests
        run: python -m pytest -q tests/test_desktop_launcher.py
      - name: Build portable application
        run: python -m PyInstaller --noconfirm --clean desktop/CommLabDesktop.spec
      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop-artifacts | Out-Null
          Compress-Archive -Path dist/CommLab/* -DestinationPath desktop-artifacts/CommLab-Windows-x64.zip
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: ISCC.exe desktop/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: CommLab-v3.7.1-Windows-x64
          path: desktop-artifacts/*
          if-no-files-found: error
