[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commlab-ofdm"
version = "3.7.1"
description = "Modular wireless communication systems laboratory for waveform, receiver, MIMO, coding/HARQ, RF, sensing, system-level, over-the-air computation, and edge-intelligence experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
app = ["streamlit>=1.36", "pandas>=2.0"]
desktop = ["streamlit>=1.63,<2", "pandas>=2.0,<4"]
desktop-build = ["streamlit>=1.63,<2", "pandas>=2.0,<4", "pyinstaller>=6.22,<7"]

[tool.setuptools.packages.find]
where = ["src"]
